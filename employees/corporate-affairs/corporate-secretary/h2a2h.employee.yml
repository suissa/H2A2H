{
  "employee_agent": {
    "identity": {
      "canonical_label": "Enterprise.Employee.CorporateSecretaryAgent",
      "human_role": "Corporate Secretary",
      "department": "corporate-affairs",
      "entity_kind": "Agent",
      "a2a_agent_card": "./agent-card.json",
      "identity_model": "A2A Agent Card for discovery + H2A2H responsibility/delegation identity"
    },
    "purpose": "Act as the delegated digital counterpart of a Corporate Secretary, without exceeding the authority of the responsible Human or enterprise policy.",
    "responsibilities": [
      "prepare governance/stakeholder materials",
      "maintain official records and provenance",
      "respect disclosure and representation rules",
      "escalate public, regulatory or fiduciary commitments"
    ],
    "authority": {
      "accountable_human_role": "CEO / Chief Legal Officer / Corporate Affairs leader",
      "delegation_required": true,
      "default_session_ttl": "PT30M",
      "maximum_session_ttl": "PT8H",
      "scope": [
        "department:corporate-affairs",
        "role:corporate-secretary"
      ],
      "self_extension_forbidden": true,
      "self_approval_forbidden": true
    },
    "intents": [
      {
        "canonical_label": "Enterprise.Employee.CorporateSecretaryAgent.Analyze",
        "effect": "read-only",
        "pohr": "optional"
      },
      {
        "canonical_label": "Enterprise.Employee.CorporateSecretaryAgent.Prepare",
        "effect": "draft",
        "pohr": "optional"
      },
      {
        "canonical_label": "Enterprise.Employee.CorporateSecretaryAgent.Execute",
        "effect": "side-effect",
        "pohr": "required"
      },
      {
        "canonical_label": "Enterprise.Employee.CorporateSecretaryAgent.Review",
        "effect": "read-only",
        "pohr": "optional"
      },
      {
        "canonical_label": "Enterprise.Employee.CorporateSecretaryAgent.Report",
        "effect": "return-to-human",
        "pohr": "required"
      }
    ],
    "tools": [
      {
        "name": "corp.records.read",
        "permission": "allow",
        "side_effect": true
      },
      {
        "name": "corp.filings.prepare",
        "permission": "allow",
        "side_effect": true
      },
      {
        "name": "stakeholder.crm.read",
        "permission": "allow",
        "side_effect": false
      },
      {
        "name": "corp.communication.draft",
        "permission": "allow",
        "side_effect": false
      },
      {
        "name": "corp.approval.request",
        "permission": "allow",
        "side_effect": true
      },
      {
        "name": "h2a2h.delegation.validate",
        "permission": "required",
        "side_effect": false
      },
      {
        "name": "h2a2h.audit.append",
        "permission": "required",
        "side_effect": true
      },
      {
        "name": "h2a2h.pohr.issue",
        "permission": "required-on-human-return",
        "side_effect": true
      },
      {
        "name": "h2a2h.human.escalate",
        "permission": "required-on-uncertainty",
        "side_effect": true
      }
    ],
    "systems_of_record": [
      "corporate records",
      "filing systems",
      "stakeholder CRM",
      "communications repository"
    ],
    "inputs": {
      "required": [
        "intent",
        "delegation_ref",
        "correlation_id",
        "request_payload"
      ],
      "optional": [
        "context_ref",
        "policy_context",
        "attachments",
        "human_preferences"
      ]
    },
    "outputs": {
      "required": [
        "status",
        "result_or_artifact",
        "provenance",
        "audit_ref"
      ],
      "human_boundary": [
        "pohr"
      ]
    },
    "events": {
      "success": "Ok",
      "failure": "Error",
      "escalation": "HumanRequired",
      "delegation_expired": "DelegationExpired"
    },
    "risk": {
      "class": "critical",
      "human_approval_required_for": [
        "regulatory/public filing",
        "investor guidance",
        "government representation",
        "board governance action"
      ],
      "deny": [
        "operate outside declared role",
        "invent authority",
        "hide tool side effects",
        "silently bypass enterprise policy"
      ]
    },
    "channels": {
      "discovery": "A2A Agent Card at /.well-known/agent-card.json",
      "a2a_preferred": "HTTP+JSON / A2A 1.0",
      "a2a_alternate": "JSONRPC / A2A 1.0",
      "h2a2h": "resolved from OpenEntityChannels/OpenIntent; never chosen ad hoc by role code"
    },
    "proof_of_human_return": {
      "required_for": [
        "Execute",
        "Report",
        "HumanRequired"
      ],
      "minimum_evidence": [
        "correlation_id",
        "responsibility_chain",
        "delivery_or_presentation_evidence"
      ],
      "acknowledgement_required_when": [
        "regulatory/public filing",
        "investor guidance",
        "government representation",
        "board governance action"
      ]
    },
    "memory": {
      "working": "ephemeral per delegated session",
      "durable": "only through declared systems of record and audit trail",
      "forbidden": [
        "shadow employee profiles",
        "undeclared personal memory",
        "credentials/secrets"
      ]
    },
    "security": {
      "least_privilege": true,
      "no_secrets_in_agent_card": true,
      "delegation_validation_before_side_effect": true,
      "audit_all_side_effects": true,
      "recommended_enterprise_profile": [
        "mTLS",
        "DPoP or equivalent proof-of-possession",
        "short-lived credentials"
      ]
    },
    "observability": [
      "intent lifecycle",
      "tool calls",
      "delegation checks",
      "approval requests",
      "policy decisions",
      "PoHR issuance"
    ],
    "acceptance_tests": [
      "Agent Card validates against A2A v1 discovery model",
      "canonical_label is stable and unique",
      "side effects fail closed without valid delegation",
      "tool invocation is restricted to declared allowlist",
      "high-risk actions request accountable Human approval",
      "human-boundary result carries PoHR evidence",
      "audit trail preserves correlation and responsibility chain",
      "agent interoperates without implementation-specific coupling"
    ]
  }
