name: H2A2H Conformance CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java for TLA+ model checking
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Validate normative schema JSON
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/h2a2h-v1.schema.json','utf8')); console.log('H2A2H schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/h2a2h-agentic-generalization-v1.schema.json','utf8')); console.log('Agentic generalization schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/h2a2h-external-agent-api-v1.schema.json','utf8')); console.log('External Agent API schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/employee-agent-runtime.schema.json','utf8')); console.log('Employee Agent runtime schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/employee-tool-capability.schema.json','utf8')); console.log('Employee Tool capability schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/employee-provider-pack.schema.json','utf8')); console.log('Employee Provider Pack schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('capabilities/employee-tools/catalog.json','utf8')); console.log('Employee Tool catalog JSON valid')"

      - name: Validate Provider Pack catalog
        run: |
          node scripts/validate-provider-packs.mjs
          node scripts/validate-provider-packs-self-test.mjs

      - name: Validate employee Agent catalog
        run: node scripts/validate-employee-agents.mjs

      - name: Release artifact gate
        run: npm run release:gate

      - name: Validate tag ruleset verifier
        run: npm run release:tag-protection:self-test

      - name: Validate independent review verifier
        run: npm run release:independent-review:self-test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Conformance suite
        run: npm test

      - name: Model-check causal responsibility invariants
        run: |
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -deadlock \
            -config formal/H2A2H_Responsibility.cfg formal/H2A2H_Responsibility.tla

      - name: Dependency audit
        run: npm audit --audit-level=high
