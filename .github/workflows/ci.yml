name: H2A2H Conformance CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Validate normative schema JSON
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/h2a2h-v1.schema.json','utf8')); console.log('H2A2H schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/employee-agent-runtime.schema.json','utf8')); console.log('Employee Agent runtime schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/employee-tool-capability.schema.json','utf8')); console.log('Employee Tool capability schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/employee-provider-pack.schema.json','utf8')); console.log('Employee Provider Pack schema JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('capabilities/employee-tools/catalog.json','utf8')); console.log('Employee Tool catalog JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('providers/reference-commerce/manifest.json','utf8')); console.log('Reference Provider Pack manifest JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('providers/finance-http-json/manifest.json','utf8')); console.log('Finance Provider Pack manifest JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('providers/engineering-http-json/manifest.json','utf8')); console.log('Engineering Provider Pack manifest JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('providers/hr-http-json/manifest.json','utf8')); console.log('HR Provider Pack manifest JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('providers/sales-customer-http-json/manifest.json','utf8')); console.log('Sales/Customer Provider Pack manifest JSON valid')"
          node -e "JSON.parse(require('node:fs').readFileSync('providers/marketing-communications-http-json/manifest.json','utf8')); console.log('Marketing/Communications Provider Pack manifest JSON valid')"

      - name: Validate employee Agent catalog
        run: node scripts/validate-employee-agents.mjs

      - name: Release artifact gate
        run: npm run release:gate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Conformance suite
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
