name: H2A2H Conformance CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Validate normative schema JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('schemas/h2a2h-v1.schema.json','utf8')); console.log('schema JSON valid')"

      - name: Release artifact gate
        run: npm run release:gate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Conformance suite
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
