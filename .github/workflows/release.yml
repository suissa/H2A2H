name: H2A2H Release

on:
  workflow_run:
    workflows:
      - H2A2H Conformance CI
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Release artifact gate
        run: npm run release:gate

      - name: Typecheck
        run: npm run typecheck

      - name: Build and conformance
        run: npm run conformance

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Resolve immutable release identity
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$EXISTING_SHA" = "$RELEASE_SHA" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "$TAG already points to validated commit $RELEASE_SHA"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is already published immutably at $EXISTING_SHA; validated commit $RELEASE_SHA will not move it"
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$RELEASE_SHA" >/dev/null
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Created $TAG at $RELEASE_SHA"
          fi

      - name: Generate conformance report
        if: steps.release_meta.outputs.publish == 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REF_NAME: ${{ steps.release_meta.outputs.tag }}
        run: node scripts/conformance-report.mjs

      - name: Upload conformance artifact
        if: steps.release_meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: h2a2h-conformance-${{ steps.release_meta.outputs.tag }}
          path: conformance-report.json

      - name: Create or update GitHub Release
        if: steps.release_meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" conformance-report.json --clobber
          else
            gh release create "$TAG" conformance-report.json \
              --generate-notes \
              --title "H2A2H $TAG"
          fi
