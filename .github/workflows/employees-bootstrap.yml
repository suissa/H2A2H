name: Bootstrap Employee Agent Catalog

on:
  push:
    branches:
      - employees-agent-catalog
    paths:
      - 'employees/**'
      - 'scripts/generate-employee-agents.mjs'
      - 'scripts/normalize-employee-agents.mjs'
      - 'scripts/bootstrap-employee-issues.mjs'
      - '.github/workflows/employees-bootstrap.yml'

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employees-agent-catalog
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate employee Agent contracts
        run: node scripts/generate-employee-agents.mjs
      - name: Normalize semantic identities
        run: node scripts/normalize-employee-agents.mjs
      - name: Commit generated employee folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add employees
          if git diff --cached --quiet; then
            echo "Employee catalog already materialized"
          else
            git commit -m "employees: materialize 105 employee agent contracts"
            git push origin HEAD:employees-agent-catalog
          fi
      - name: Create missing employee-agent issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bootstrap-employee-issues.mjs
